<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>unit-converter</title>
  </head>
  <body>
    <div id="app">
      <header class="hero">
        <h1>Metric to imperial unit converter</h1>
        <p>Convert units of measurement</p>
        <h2 id="value">0</h2>
        <form>
          <input
            type="text"
            id="input-value"
            placeholder="Type your value ..."
          />
          <button type="submit" id="convert-button">Convert</button>
        </form>
      </header>
      <main id="results">
        <div class="result-container-1">
          <h2>Length (meters to feet)</h2>
          <h3>0 meters = 0 feet</h3>
        </div>
        <div class="result-container-2">
          <h2>Weight (kilograms to pounds)</h2>
          <h3>0 kilograms = 0 pounds</h3>
        </div>
        <div class="result-container-3">
          <h2>Volume (liters to gallons)</h2>
          <h3>0 liters = 0 gallons</h3>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js" defer></script>
  </body>
</html>
